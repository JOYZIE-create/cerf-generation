<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PT Sans', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Текст статуса:</label>
            <input type="text" id="statusInput" value="Поздравляем, ты прошел первый тур!">
        </div>
        <div class="input-group">
            <label>Баллы:</label>
            <input type="text" id="scoreInput" value="Твои баллы: 70 из 70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            // Подстраиваем холст под реальный размер картинки
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            generateCertificate();
        };

        // Функция для переноса текста, если он слишком длинный
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];
            
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            // Центрируем по вертикали, если строк несколько
            let startY = y - ((lines.length - 1) * lineHeight) / 2;

            for(let i = 0; i < lines.length; i++) {
                context.fillText(lines[i].trim(), x, startY + (i * lineHeight));
            }
        }

        function generateCertificate() {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const statusText = document.getElementById('statusInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            // Пропорции (в процентах от высоты), чтобы текст лег ровно
            const yStatus = canvas.height * 0.297; 
            const yScore = canvas.height * 0.335;

            // --- 1. Умная замазка старого текста ---
            // Берем кусок фона ВЫШЕ текста и накладываем поверх него
            ctx.drawImage(bgImage, 0, yStatus - 80, canvas.width, 50, 0, yStatus - 25, canvas.width, 50);
            ctx.drawImage(bgImage, 0, yScore - 80, canvas.width, 45, 0, yScore - 22, canvas.width, 45);

            // --- 2. Настройка текста ---
            ctx.fillStyle = '#0A2647'; // Темно-синий цвет
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Размер шрифта зависит от ширины картинки
            const fontSize = canvas.width * 0.045; 

            // Рисуем статус (жирный PT Sans)
            ctx.font = '700 ' + fontSize + 'px "PT Sans", sans-serif';
            wrapText(ctx, statusText, canvas.width / 2, yStatus, canvas.width * 0.85, fontSize * 1.2);

            // Рисуем баллы
            ctx.font = '700 ' + (fontSize * 0.95) + 'px "PT Sans", sans-serif';
            ctx.fillText(scoreText, canvas.width / 2, yScore);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
