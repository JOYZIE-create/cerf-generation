<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PT Sans', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Слово (вместо "прошла"):</label>
            <input type="text" id="wordInput" value="прошел">
        </div>
        <div class="input-group">
            <label>Баллы (вместо "53"):</label>
            <input type="text" id="scoreInput" value="70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        // Убедись, что название файла совпадает с тем, что в репозитории
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            generateCertificate();
        };

        function generateCertificate() {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const wordText = document.getElementById('wordInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            // --- 1. ИДЕАЛЬНАЯ ЗАМАЗКА СТАРОГО ТЕКСТА ---
            // Координаты области, где находится старый текст
            const startY = Math.floor(canvas.height * 0.33); // Начало текста
            const endY = Math.floor(canvas.height * 0.45);   // Конец текста

            // Построчно копируем чистый фон с левой стороны (x=150, где нет кнопки "назад")
            // и растягиваем его на всю ширину, чтобы скрыть старые буквы
            for (let y = startY; y < endY; y++) {
                ctx.drawImage(bgImage, 150, y, 1, 1, 0, y, canvas.width, 1);
            }

            // --- 2. РИСОВАНИЕ НОВОГО ТЕКСТА ---
            ctx.fillStyle = '#0c2a50'; // Темно-синий цвет
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const fontSize = canvas.width * 0.045; // Чуть уменьшили размер
            ctx.font = `700 ${fontSize}px "PT Sans", sans-serif`;

            // Собираем и рисуем текст статуса
            let line1 = "Поздравляем, ты " + wordText + " первый";
            ctx.fillText(line1, canvas.width / 2, canvas.height * 0.36);
            
            ctx.fillText("тур!", canvas.width / 2, canvas.height * 0.40);

            // Собираем и рисуем баллы
            ctx.font = `700 ${fontSize * 0.95}px "PT Sans", sans-serif`;
            let line3 = "Твои баллы: " + scoreText + " из 70";
            ctx.fillText(line3, canvas.width / 2, canvas.height * 0.45);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
