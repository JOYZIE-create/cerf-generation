<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Текст статуса:</label>
            <input type="text" id="statusInput" value="Поздравляем, ты прошел первый тур!">
        </div>
        <div class="input-group">
            <label>Баллы:</label>
            <input type="text" id="scoreInput" value="Твои баллы: 70 из 70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas" width="720" height="1600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            generateCertificate();
        };

        function generateCertificate() {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const statusText = document.getElementById('statusInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            const textColor = '#0A2647'; 
            const bgColor = '#5bc0d9';   

            ctx.fillStyle = bgColor;

            ctx.fillRect(100, 500, 520, 50);
            ctx.fillRect(200, 580, 320, 45);

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.font = 'bold 32px Roboto, sans-serif';
            ctx.fillText(statusText, canvas.width / 2, 525);

            ctx.font = 'bold 30px Roboto, sans-serif';
            ctx.fillText(scoreText, canvas.width / 2, 605);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
