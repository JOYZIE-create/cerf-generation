<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PT Sans', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Слово (вместо "прошла"):</label>
            <input type="text" id="wordInput" value="прошел">
        </div>
        <div class="input-group">
            <label>Баллы (вместо "53"):</label>
            <input type="text" id="scoreInput" value="70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            generateCertificate();
        };

        function generateCertificate() {
            // 1. Рисуем оригинальную картинку целиком
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const wordText = document.getElementById('wordInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            // Масштабирование (на случай, если картинка не 720x1600)
            const sX = canvas.width / 720;
            const sY = canvas.height / 1600;

            // 2. УМНАЯ ЗАМАЗКА (только под конкретными словами)
            // Берем цвет пикселя с левой стороны картинки, где нет текста, чтобы идеально попасть в фон
            function clearArea(x, y, w, h) {
                const color = ctx.getImageData(50 * sX, y + (h * sY)/2, 1, 1).data;
                ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                ctx.fillRect(x * sX, y * sY, w * sX, h * sY);
            }

            // Замазываем ТОЛЬКО слово "прошла" (Координаты подобраны по пикселям)
            clearArea(385, 460, 155, 50);

            // Замазываем ТОЛЬКО число "53"
            clearArea(375, 570, 55, 50);

            // 3. РИСОВАНИЕ НОВОГО ТЕКСТА (ровно на месте старого)
            ctx.fillStyle = '#0A2647'; // Темно-синий цвет оригинала
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Размер шрифта 38px идеально совпадает с оригиналом на разрешении 720px
            const fontSize = 38 * sX;
            ctx.font = `700 ${fontSize}px "PT Sans", sans-serif`;

            // Рисуем слово точно по центру замазанного места (X=462, Y=485)
            ctx.fillText(wordText, 462 * sX, 485 * sY);

            // Рисуем баллы точно по центру замазанного места (X=402, Y=595)
            ctx.fillText(scoreText, 402 * sX, 595 * sY);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
