<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PT Sans', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Текст статуса:</label>
            <input type="text" id="statusInput" value="Поздравляем, ты прошел первый тур!">
        </div>
        <div class="input-group">
            <label>Баллы:</label>
            <input type="text" id="scoreInput" value="Твои баллы: 70 из 70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            generateCertificate();
        };

        function generateCertificate() {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const statusText = document.getElementById('statusInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            // --- 1. ИДЕАЛЬНАЯ ЗАМАЗКА СТАРОГО ТЕКСТА ---
            // Берем 1 пиксель ширины слева (где нет текста) и растягиваем на всю ширину
            // Это сохраняет градиент, но убирает буквы. Координаты по Y подобраны точно.
            
            // Затираем блок статуса (от 480 до 560 пикселя)
            ctx.drawImage(bgImage, 0, 480, 1, 80, 0, 480, canvas.width, 80);
            
            // Затираем блок баллов (от 570 до 620 пикселя)
            ctx.drawImage(bgImage, 0, 570, 1, 50, 0, 570, canvas.width, 50);

            // --- 2. РИСОВАНИЕ НОВОГО ТЕКСТА ---
            ctx.fillStyle = '#0c2a50'; // Точный темно-синий цвет
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const fontSize = canvas.width * 0.042; 
            ctx.font = `700 ${fontSize}px "PT Sans", sans-serif`;

            // Форматируем текст статуса в две строки, как в оригинале
            let line1 = statusText;
            let line2 = "";
            
            // Если текст длинный, переносим последнее слово на вторую строку
            if (statusText.length > 25) {
                let lastSpace = statusText.lastIndexOf(' ');
                if (lastSpace !== -1) {
                    line1 = statusText.substring(0, lastSpace);
                    line2 = statusText.substring(lastSpace + 1);
                }
            }

            // Рисуем статус (Y = 515 для первой строки, Y = 555 для второй)
            ctx.fillText(line1, canvas.width / 2, 515);
            if (line2) {
                ctx.fillText(line2, canvas.width / 2, 555);
            }

            // Рисуем баллы (Y = 595)
            ctx.font = `700 ${fontSize * 0.95}px "PT Sans", sans-serif`;
            ctx.fillText(scoreText, canvas.width / 2, 595);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
