<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PT Sans', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Слово (вместо "прошла"):</label>
            <input type="text" id="wordInput" value="прошел">
        </div>
        <div class="input-group">
            <label>Баллы (вместо "53"):</label>
            <input type="text" id="scoreInput" value="70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            generateCertificate();
        };

        function generateCertificate() {
            // 1. Рисуем оригинальную картинку
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const wordText = document.getElementById('wordInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            // Масштабирование под разрешение картинки (чтобы работало на любом телефоне)
            const sX = canvas.width / 720;
            const sY = canvas.height / 1600;

            // 2. ЗАМАЗКА (только в нужных местах)
            // Берем цвет фона слева (где нет текста), чтобы идеально закрасить старое слово
            function clearArea(x, y, w, h) {
                const color = ctx.getImageData(20 * sX, (y + h/2) * sY, 1, 1).data;
                ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                ctx.fillRect(x * sX, y * sY, w * sX, h * sY);
            }

            // Замазываем слово "прошла" (Y = 535)
            clearArea(380, 535, 125, 40);

            // Замазываем число "53" (Y = 645)
            clearArea(425, 645, 40, 40);

            // 3. РИСОВАНИЕ НОВОГО ТЕКСТА
            ctx.fillStyle = '#0A2647'; // Темно-синий
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const fontSize = 34 * sX; 
            ctx.font = `700 ${fontSize}px "PT Sans", sans-serif`;

            // Рисуем новое слово по центру (X=442, Y=555)
            ctx.fillText(wordText, 442 * sX, 555 * sY);

            // Рисуем новые баллы по центру (X=445, Y=665)
            ctx.fillText(scoreText, 445 * sX, 665 * sY);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
