<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PT Sans', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0055ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0044cc;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Текст статуса:</label>
            <input type="text" id="statusInput" value="Поздравляем, ты прошел первый тур!">
        </div>
        <div class="input-group">
            <label>Баллы:</label>
            <input type="text" id="scoreInput" value="Твои баллы: 70 из 70">
        </div>
        <button onclick="generateCertificate()">Обновить</button>
        <button onclick="downloadImage()" style="background-color: #28a745;">Скачать</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgImage = new Image();
        
        // Если переименуешь картинку в bg.png, поменяй здесь название
        bgImage.src = 'IMG-20261126-WA0000.jpg'; 

        bgImage.onload = function() {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            generateCertificate();
        };

        // Функция для получения цвета пикселя (чтобы замазка совпадала с градиентом)
        function getPixelColor(x, y) {
            const data = ctx.getImageData(x, y, 1, 1).data;
            return `rgb(${data[0]}, ${data[1]}, ${data[2]})`;
        }

        // Функция для рисования текста с трекингом (расстоянием между буквами)
        function drawSpacedText(text, x, y, spacing) {
            let totalWidth = 0;
            for (let i = 0; i < text.length; i++) {
                totalWidth += ctx.measureText(text[i]).width + spacing;
            }
            totalWidth -= spacing; // Убираем лишний пробел в конце
            
            let currentX = x - (totalWidth / 2);
            for (let i = 0; i < text.length; i++) {
                ctx.fillText(text[i], currentX, y);
                currentX += ctx.measureText(text[i]).width + spacing;
            }
        }

        function generateCertificate() {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const statusText = document.getElementById('statusInput').value;
            const scoreText = document.getElementById('scoreInput').value;

            // --- 1. ИДЕАЛЬНАЯ ЗАМАЗКА СТАРОГО ТЕКСТА ---
            // Координаты подобраны под твой оригинал
            const statusYStart = canvas.height * 0.29;
            const statusYEnd = canvas.height * 0.35;
            const scoreYStart = canvas.height * 0.36;
            const scoreYEnd = canvas.height * 0.40;

            // Градиент для статуса
            const gradStatus = ctx.createLinearGradient(0, statusYStart, 0, statusYEnd);
            gradStatus.addColorStop(0, getPixelColor(10, statusYStart));
            gradStatus.addColorStop(1, getPixelColor(10, statusYEnd));
            ctx.fillStyle = gradStatus;
            ctx.fillRect(0, statusYStart, canvas.width, statusYEnd - statusYStart);

            // Градиент для баллов
            const gradScore = ctx.createLinearGradient(0, scoreYStart, 0, scoreYEnd);
            gradScore.addColorStop(0, getPixelColor(10, scoreYStart));
            gradScore.addColorStop(1, getPixelColor(10, scoreYEnd));
            ctx.fillStyle = gradScore;
            ctx.fillRect(0, scoreYStart, canvas.width, scoreYEnd - scoreYStart);

            // --- 2. РИСОВАНИЕ НОВОГО ТЕКСТА ---
            ctx.fillStyle = '#0A2647'; // Темно-синий
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const fontSize = canvas.width * 0.046; 
            ctx.font = `700 ${fontSize}px "PT Sans", sans-serif`;

            // Разбиваем текст статуса на две строки (как в оригинале)
            // Ищем пробел, чтобы перенести "тур!" вниз, если текст длинный
            let lines = [];
            if (statusText.length > 28) {
                let words = statusText.split(' ');
                let mid = Math.ceil(words.length / 2);
                lines.push(words.slice(0, mid).join(' '));
                lines.push(words.slice(mid).join(' '));
            } else {
                lines.push(statusText);
            }

            // Рисуем статус с трекингом (0.5 пикселя между буквами)
            const tracking = 0.5; 
            const lineHeight = fontSize * 1.15;
            const statusCenterY = canvas.height * 0.315;
            let startY = statusCenterY - ((lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, index) => {
                drawSpacedText(line, canvas.width / 2, startY + (index * lineHeight), tracking);
            });

            // Рисуем баллы с трекингом
            ctx.font = `700 ${fontSize * 0.95}px "PT Sans", sans-serif`;
            drawSpacedText(scoreText, canvas.width / 2, canvas.height * 0.38, tracking);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'certificate.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
